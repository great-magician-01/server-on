[workspace]
members = ["crates/core", "crates/daemon", "crates/daemon-app", "crates/gui", "crates/cli"]
exclude = ["tools/icon-gen"]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
server-on-core = { path = "crates/core" }
server-on-daemon = { path = "crates/daemon" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
